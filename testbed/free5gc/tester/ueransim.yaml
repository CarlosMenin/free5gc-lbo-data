# UERANSIM - UE/gNB emulation. It REPLACES my5G-RANTester.
#
# WHY THE SWITCH:
#   my5G-RANTester has the free5gc libs vendored and frozen in 2022
#   (last upstream commit: Aug/2022). It declares IE 126 of NGAP
#   (AdditionalUL-NGU-UP-TNLInformation) as a single CHOICE
#   (*UPTransportLayerInformation), which is the Release 15 form.
#   free5gc started to emit it as a LIST (UPTransportLayerInformationList,
#   Release 16) in commit 5a36c7e (2025-03-24), which first entered
#   a release in SMF v1.4.0 (2025-08-20) -- that is, AFTER the v3.3.0 used
#   in the 2024 papers and BEFORE the v4.2.3 of this testbed. Result:
#       [GNB][NGAP] Error in decode Pdu Session Resource Setup Request Transfer
#       panic: index out of range [0] with length 0    (handler.go:354)
#   The whole NAS registration worked; only the PDU session setup broke.
#
#   The free5gc/ueransim:v4.2.3 image brings UERANSIM v3.3.0, published by the
#   free5gc project itself on the same day as the other v4.2.3 images. In this tag,
#   IE 126 is bound to asn_DEF_ASN_NGAP_UPTransportLayerInformationList
#   (R16), so it decodes what v4.2.3 emits.
#
# WHAT IS LOST: the "[ANALYTICS]" output with timestamps of my5G-RANTester. For
# session setup latency use the native Prometheus histograms of v4.x, already
# enabled in the SMF/AMF (metrics.enable + ServiceMonitor):
#     free5gc_sbi_inbound_request_duration_seconds
#
# THE NUMBER OF UEs IS DEFINED HERE, not by 'kubectl scale' at run
# time: 'replicas' below is how many tester pods come up, and NUM_UE in the
# 'ue' container is how many sequential IMSIs each pod registers (limit of 512
# per nr-ue process). The test reads this value from the StatefulSet and goes on.
# Remember that the ULCL only applies to the IMSIs listed in ueRouting.yaml --
# for more than 5 UEs, regenerate the list with scripts/gen_uerouting.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ueransim-config
  namespace: free5gc
data:
  # ngapIp/gtpIp carry @POD_IP@ because UERANSIM does not expand environment
  # variables in the YAML: the container does the sed at boot (Downward API).
  # linkIp stays at 127.0.0.1 -- nr-gnb and nr-ue are containers of the SAME pod,
  # so they share the network namespace and the simulated radio link does not leave the loopback.
  gnb.yaml: |
    mcc: '208'
    mnc: '93'

    nci: '0x000000010'
    idLength: 32
    tac: 1              # matches supportTaiList[0].tac: 000001 of amf.yaml

    linkIp: 127.0.0.1
    ngapIp: '@POD_IP@'
    gtpIp: '@POD_IP@'

    amfConfigs:
      - address: amf.free5gc.svc.cluster.local   # an FQDN works: the SCTP of
        port: 38412                              # UERANSIM resolves it through getaddrinfo
    slices:
      - sst: 0x1
        sd: 0x010203

    ignoreStreamIds: true

  ue.yaml: |
    # First IMSI. It matches provision_subscribers.py and the members of
    # ueRouting.yaml of Scenario B.
    supi: 'imsi-208930000000000'
    mcc: '208'
    mnc: '93'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'

    # Same credentials written to Mongo by scripts/provision_subscribers.py.
    key: '8baf473f2f8fd09487cccbd7097c6862'
    op: '8e27b6af0e692e750f32667a3b14605d'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'

    tunNetmask: '255.255.255.0'

    # false is ESSENTIAL: with true UERANSIM creates uesimtun0 in a dedicated
    # netns and the vr-client sidecar would no longer see the interface.
    useNamespace: false

    gnbSearchList:
      - 127.0.0.1

    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 0x01
          sd: 0x010203

    configured-nssai:
      - sst: 0x01
        sd: 0x010203
    default-nssai:
      - sst: 1
        sd: 1

    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: free5gc-ueransim
  namespace: free5gc
  labels:
    epc-mode: ueransim
spec:
  serviceName: ueransim
  replicas: 1
  selector:
    matchLabels:
      epc-mode: ueransim
  template:
    metadata:
      labels:
        epc-mode: ueransim
        app: free5gc-ueransim
        prometheus: free5gc-monitor
    spec:
      # "UE / RAN Emulation" box of Fig. 3 of the TG1 proposal -- a node of ITS OWN, OUTSIDE the
      # Edge Node.
      #
      # The figure draws this box apart from the boxes of the Edge Nodes, and the
      # reason is architectural, not layout: the subscriber does NOT live inside
      # the MEC host. It arrives through the access network. Running the UE on the same node as
      # mec-app would make the "user" a resident of the infrastructure it
      # consumes, and the measured path would start inside the Edge Node itself.
      #
      # It stays on brix-porvir-02: SAME segment as the brix machines (<edge-subnet>, 1 switch
      # hop), so still on THIS side of the Backhaul/Transport Network.
      # This matters -- if the tester went to the core, the radio access itself
      # would cross the transport, which is exactly what the architecture says
      # does NOT happen.
      #
      # What is given up: the gNB no longer shares the motherboard with the dUPF and comes
      # to be 1 switch hop from it. "Co-located with the RAN" (Section 1)
      # still holds in the sense the expression has in an operator network --
      # same site, same switch --; in a real cell site the radio and the UPF appliance
      # are also separate boxes. And the cost is common to both
      # scenarios: in A the N3 crosses the backhaul anyway.
      #
      # What is gained, besides the semantics: the heaviest pod of the experiment
      # (nr-gnb + nr-ue in user space + vr_client) stops competing for the
      # 2 physical cores of the Edge Node with gtp5g and vr-server. It was this
      # contention that stalled the 100 Mbps profile in an early campaign -- the
      # measured bottleneck was vr-server, which sustained 53 of the 90 fps. With the Edge
      # Node relieved, this step becomes testable again.
      #
      # This is also where the VR client measures: its SO_RCVBUF depends on
      # net.core.rmem_max, a global sysctl of the NODE. That is why the tester needs a
      # brix (where there is sudo), and not a core node.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: brix-porvir-02
        #nodetype: server
      volumes:
        - name: ueransim-config
          configMap:
            name: ueransim-config
        # The configMap mounts read-only and the sed needs to write; the rendered
        # configs go here.
        - name: ueransim-run
          emptyDir: {}
        - name: vr-app
          configMap:
            name: vr-app
        # Results of the runs (CSV/JSON). They are copied out with
        # 'kubectl cp' at the end of each campaign.
        - name: vr-results
          emptyDir: {}
      containers:
        # ---------------------------------------------------------------
        # gNB: speaks N2 (NGAP/SCTP) with the AMF and N3 (GTP-U) with the UPF.
        # ---------------------------------------------------------------
        - name: gnb
          image: free5gc/ueransim:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sed "s/@POD_IP@/${POD_IP}/g" /config/gnb.yaml > /run/ueransim/gnb.yaml
              echo "[gnb] ngapIp/gtpIp = ${POD_IP}"
              exec ./nr-gnb -c /run/ueransim/gnb.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: ueransim-config
              mountPath: /config
            - name: ueransim-run
              mountPath: /run/ueransim
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
        # ---------------------------------------------------------------
        # UE: creates the tunnel interface uesimtun0 in the netns of the POD.
        # NUM_UE > 1 generates sequential IMSIs from the supi of ue.yaml
        # (uesimtun0, uesimtun1, ...). Limit of 512 per nr-ue process.
        # ---------------------------------------------------------------
        - name: ue
          image: free5gc/ueransim:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /config/ue.yaml /run/ueransim/ue.yaml
              # nr-gnb must have the radio link up before nr-ue
              # tries to register; without this the UE fails at the first attach.
              until [ -f /run/ueransim/gnb.yaml ]; do sleep 1; done
              sleep 5
              exec ./nr-ue -c /run/ueransim/ue.yaml -n "${NUM_UE}"
          env:
            - name: NUM_UE
              value: "1"
          volumeMounts:
            - name: ueransim-config
              mountPath: /config
            - name: ueransim-run
              mountPath: /run/ueransim
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
        # ---------------------------------------------------------------
        # Sidecar of the VR client. It shares the NETWORK NAMESPACE with the gNB and the
        # UE (containers of the same pod share it), so it sees uesimtun0
        # and can send traffic INSIDE the PDU session -- without that the
        # measurement would leave through eth0 of the pod and go through no UPF.
        #
        # It stays asleep; the campaign triggers it with 'kubectl exec'. The tunnel
        # route and the measurement commands are in scripts/run_scenario_b.py.
        # ---------------------------------------------------------------
        - name: vr-client
          image: python:3.12-slim
          command: ["sleep", "infinity"]
          env:
            - name: VR_SERVER
              value: "mec-app.free5gc.svc.cluster.local:9100"
            - name: VR_DURATION
              value: "60"
            - name: VR_POSE_HZ
              value: "250"
          volumeMounts:
            - name: vr-app
              mountPath: /opt/vr
              readOnly: true
            - name: vr-results
              mountPath: /data
---
