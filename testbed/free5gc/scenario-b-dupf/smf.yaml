# SCENARIO B: SMF with ULCL enabled.
#
# Topology:   gNB1 --N3--> I-UPF (edge) --N9--> PSA-UPF (core) --N6--> internet
#                              |
#                              +--N6--> MEC service (LOCAL BREAKOUT)
#
# Slice 1/112233 (only the background UE, background/background-gtp.yaml):
#              gNB  --N3--> PSA-UPF (core) --N6--> internet
#
# The ULCL of free5gc only applies to UEs listed explicitly in
# ueRouting.yaml (ueRoutingInfo.<group>.members). UEs outside the list fall on the
# default path derived from "links".
apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-config
  namespace: free5gc
data:
  smfConfig.yaml: |
    info:
      version: 1.0.7
      description: SMF - Scenario B (dUPF with ULCL / Local Breakout)

    configuration:
      smfName: SMF
      sbi:
        scheme: http
        registerIPv4: smf.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/smf.key
          pem: cert/smf.pem
      serviceNameList:
        - nsmf-pdusession
        - nsmf-event-exposure
        - nsmf-oam
        - nsmf-callback
      snssaiInfos:
        - sNssai:
            sst: 1
            sd: 010203
          dnnInfos:
            - dnn: internet
              dnaiList:
                - mec          # DNAI that identifies the edge MEC domain
              dns:
                ipv4: 10.96.0.10
                ipv6: 2001:4860:4860::8888
        - sNssai:
            sst: 1
            sd: 112233
          dnnInfos:
            - dnn: internet
              # No dnaiList: this slice has no breakout (see the I-UPF below).
              dns:
                ipv4: 10.96.0.10
                ipv6: 2001:4860:4860::8888
      plmnList:
        - mcc: 208
          mnc: 93
      locality: area1
      pfcp:
        nodeID: smf.free5gc.svc.cluster.local
        listenAddr: 0.0.0.0
        externalAddr: smf.free5gc.svc.cluster.local
        heartbeatInterval: 5s
      userplaneInformation:
        upNodes:
          gNB1:
            type: AN
          I-UPF:
            type: UPF
            nodeID: i-upf.free5gc.svc.cluster.local
            addr: i-upf.free5gc.svc.cluster.local
            # NO "pools": the branching point does not allocate UE IPs.
            # The IP comes from the PSA-UPF (anchor of the default path).
            #
            # Only slice 010203 (that of the experiment). 112233 stayed ONLY at the
            # PSA-UPF on purpose: it is the slice of the background UE
            # (background/background-gtp.yaml), traffic of another cell that comes down from the
            # core through the backhaul without going through the Edge Node. The path search
            # of the SMF (getPathBetween) skips a UPF that does not serve the slice, so,
            # with the link gNB1 -> PSA-UPF further below, the path of the background becomes
            # gNB -> PSA-UPF directly.
            #
            # Why a slice, and not a group of its own in ueRouting: the group only
            # holds while the PCF does not send the default PCC rule (precedence
            # 255, no DNAI). It sends it when the subscriber has chargingData --
            # the webconsole writes it, provision_subscribers.py does not -- and with it the SMF
            # builds the default path from the global 'links'
            # (CreatePccRuleDataPath), going through the I-UPF and ignoring the
            # topology of the group. And in 010203 the Traffic Influence of mec-af
            # (anyUeInd) would still give the background a breakout rule at the I-UPF.
            # The slice solves both cases.
            sNssaiUpfInfos:
              - sNssai:
                  sst: 1
                  sd: 010203
                dnnUpfInfoList:
                  - dnn: internet
                    dnaiList:
                      - mec
            interfaces:
              - interfaceType: N3
                endpoints:
                  - i-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
              - interfaceType: N9
                endpoints:
                  - i-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
          PSA-UPF:
            type: UPF
            nodeID: psa-upf.free5gc.svc.cluster.local
            addr: psa-upf.free5gc.svc.cluster.local
            # The SMF checks pool overlap GLOBALLY (isOverlap over
            # allUEIPPools in internal/context/user_plane_information.go): it
            # does NOT separate by S-NSSAI. Declaring 60.60.0.0/16 in both slices
            # aborts the boot with "overlap cidr value between UPFs". That is why the
            # /16 is split into two disjoint /17 - both stay inside the
            # cidr 60.60.0.0/16 of the upfcfg, so the route/NAT of the UPF does not change.
            sNssaiUpfInfos:
              - sNssai:
                  sst: 1
                  sd: 010203
                dnnUpfInfoList:
                  - dnn: internet
                    pools:
                      - cidr: 60.60.0.0/17
              - sNssai:
                  sst: 1
                  sd: 112233
                dnnUpfInfoList:
                  - dnn: internet
                    pools:
                      - cidr: 60.60.128.0/17
            interfaces:
              - interfaceType: N9
                endpoints:
                  - psa-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
              # N3 only for the background UE (slice 112233), whose path starts
              # at the PSA-UPF: the SMF hands the gNB the F-TEID of the N3 interface of the
              # FIRST UPF of the path (ngap_build.go uses N3Interfaces[0]) and,
              # without it, the session does not complete. It does not touch the path of the experiment:
              # a UPF that is not the first of the path is reached through N9
              # (datapath.go), and in slice 010203 the first is always the I-UPF.
              # On the go-upf side nothing changes: ifList only provides the address
              # (0.0.0.0:2152 serves N3 and N9 alike).
              - interfaceType: N3
                endpoints:
                  - psa-upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
        links:
          - A: gNB1
            B: I-UPF
          - A: I-UPF
            B: PSA-UPF
          # Path of slice 112233 (background). THE ORDER MATTERS: the SMF walks the
          # neighbors of gNB1 in the order of this list (depth-first search), and
          # with this link FIRST slice 010203 would start anchoring
          # gNB1 -> PSA-UPF directly, without the I-UPF -- the end of the LBO. Here, in
          # last place, 010203 still finds the I-UPF first, and 112233 reaches
          # it because the I-UPF does not serve the slice and is skipped.
          - A: gNB1
            B: PSA-UPF
      t3591:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      t3592:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      # URR (Usage Reporting Rules) -- what the UPF reports to the SMF for charging.
      #
      # The example values of free5gc (urrThreshold: 1000, in BYTES) make the
      # UPF send a PFCP Usage Report every 1000 bytes of traffic. In a ping
      # demo this is harmless; under the VR load it is fatal:
      #
      #     6 Mbps  ->    ~750 reports/s
      #    50 Mbps  ->   ~6250 reports/s
      #
      # Measured: 27,814 USA Reports on a single I-UPF. The SMF does not
      # sustain this volume of PFCP transactions, the sequence numbers
      # collide ("Sequence number 99911 already exist!"), the association with the
      # UPF DROPS ("UPF[...] not associated with SMF"), the data plane dies and
      # new PDU sessions start to fail. The SMF even panics in the
      # HTTP handler. This was the cause of the remote path "stopping by itself" in
      # the middle of the campaigns.
      #
      # And none of this serves any purpose here: there is no CHF in the testbed
      # ("chf selection error: no CHF found in CHFSelection"), so the report
      # is produced, carried and dropped. The thresholds below keep the URR
      # existing (free5gc needs the URR to build the session) without it
      # firing during a campaign.
      urrPeriod: 3600
      urrThreshold: 1000000000
      requestedUnit: 1000000000

      # Key of the scenario: it enables the Uplink Classifier.
      # Without this the ueRouting.yaml file is entirely IGNORED
      # (see InitSMFUERouting in internal/context/context.go).
      ulcl: true

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ue-routing-info
  namespace: free5gc
data:
  ueRouting.yaml: |
    info:
      version: 1.0.7
      description: UE routing - LBO via ULCL to the MEC service

    ueRoutingInfo:
      UE1:
        # Only these IMSIs get ULCL treatment.
        # To scale the number of UEs use: python3 scripts/gen_uerouting.py -n 50
        members:
          - imsi-208930000000000
          - imsi-208930000000001
          - imsi-208930000000002
          - imsi-208930000000003
          - imsi-208930000000004
        # Default path of the group: it goes up to the central anchor.
        # The SMF does a BFS from the AN node; leaves become Anchor UPFs.
        topology:
          - A: gNB1
            B: I-UPF
          - A: I-UPF
            B: PSA-UPF
        # LOCAL BREAKOUT: it is NO longer declared here. The rule arrives at runtime
        # by Traffic Influence (mec-af -> NEF -> UDR -> PCF -> SMF): the SMF
        # selects the I-UPF by the DNAI "mec" (dnaiList above) and installs the PDR
        # with the ClusterIP that k8s allocated to the service -- in open and
        # new sessions, without restart. From this file, 'ulcl: true',
        # the 'members' and the 'topology' (default path to the PSA-UPF) still apply.
        #
        # Static fallback, to debug without the NEF: uncomment, replace dest
        # with the current ClusterIP (kubectl -n free5gc get svc mec-app) and restart
        # the SMF. "dest" must be a CIDR (govalidator 'cidr').
        # specificPath:
        #   - dest: 10.96.100.100/32
        #     path: [I-UPF]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-smf
  namespace: free5gc
  labels:
    epc-mode: smf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: smf
  template:
    metadata:
      labels:
        epc-mode: smf
        app: free5gc-smf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: smf-pod
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: smf
          image: free5gc/smf:v4.2.3
          imagePullPolicy: IfNotPresent
          # -u is mandatory in the ULCL scenario.
          command: ["./smf", "-c", "/nf-config/smfConfig.yaml", "-u", "/free5gc/ue/ueRouting.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /nf-config
            - name: config-uerouting
              mountPath: /free5gc/ue
      volumes:
        - name: config-volume
          configMap:
            name: smf-config
            defaultMode: 0777
        - name: config-uerouting
          configMap:
            name: ue-routing-info
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: free5gc
  labels:
    app: free5gc-smf
spec:
  selector:
    epc-mode: smf
    app: free5gc-smf
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: free5gc-smf
  namespace: free5gc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: free5gc-smf
  endpoints:
    - interval: 15s
      port: metrics-9091
      path: /metrics
---
