# CENARIO B: PSA-UPF CENTRAL.
# Anchor do caminho default (internet). Recebe trafego do I-UPF via N9 e
# aloca o IP do UE. E' o "caminho longo" contra o qual o LBO e' comparado.
apiVersion: v1
kind: ConfigMap
metadata:
  name: psa-upf-config
  namespace: free5gc
data:
  upfConfig.yaml: |
    version: 1.0.3
    description: PSA-UPF central (anchor do caminho default) - cenario B

    pfcp:
      addr: psa-upf-pod
      nodeID: psa-upf.free5gc.svc.cluster.local
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      # So recebe N9 (do I-UPF), nunca N3 direto do gNB.
      ifList:
        - addr: 0.0.0.0
          type: N9

    dnnList:
      - dnn: internet
        cidr: 60.60.0.0/16

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: psa-upf-iptables
  namespace: free5gc
data:
  upf-iptables.sh: |
    #!/bin/bash
    # SEM ISTO O PLANO DE DADOS NAO ANDA. O pacote de uplink chega na upfgtp,
    # e' desencapsulado e precisa ser ROTEADO para fora pela eth0 -- ou seja,
    # e' um pacote encaminhado, nao destinado localmente. Com ip_forward=0 o
    # kernel o descarta ANTES da cadeia FORWARD, entao o "iptables -I FORWARD
    # -j ACCEPT" abaixo nao salva. O sintoma e' mudo: RX cresce em
    # /proc/net/dev da upfgtp, TX fica em zero e nada volta para o UE.
    # A imagem free5gc/upf nao traz o binario sysctl (procps); escrever
    # direto no /proc funciona porque o container e' privileged.
    echo 1 > /proc/sys/net/ipv4/ip_forward

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    iptables -I FORWARD 1 -j ACCEPT
    iptables -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400

    ./upf -c /configuracoes/upfConfig.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-psa-upf
  namespace: free5gc
  labels:
    epc-mode: psa-upf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: psa-upf
  template:
    metadata:
      labels:
        epc-mode: psa-upf
        app: free5gc-psa-upf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: psa-upf-pod
      # SERVER NODE (5G Core) -- a mesma maquina do plano de controle.
      #
      # A Figura 3 do TG1 desenha uma caixa so', "Server Node (5G Core)",
      # contendo o Centralized Control Plane (AMF/SMF) E o "User Plane -
      # Baseline: UPF (Centralized)". No modelo ULCL do free5gc essa UPF
      # centralizada e' exatamente o PSA: a sessao ancora aqui, e o dUPF da
      # borda so' ramifica o que vai para o MEC. Por isso este pod fica junto
      # dos NFs, e nao numa maquina propria.
      #
      # E' o que faz o caminho remoto atravessar o Backhaul/Transport Network
      # da figura: do Edge Node (<edge-subnet>) ate' aqui (<core-subnet>) o
      # pacote cruza o roteador do campus.
      #
      # O hardware daqui e' muito melhor que o do dUPF na borda (petshopboys:
      # 80 threads / 197 GB; brix: 4 threads / 3,8 GB). Isso NAO invalida a
      # medida, mas define como ela deve ser lida: a ancora central esta sendo
      # cobrada no seu melhor caso, entao o ganho medido para a borda e' um
      # PISO, nao um teto. E e' fiel: nucleo de operadora roda em servidor.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        #nodetype: server
      containers:
        - name: upf
          image: free5gc/upf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/free5gc/script/upf-iptables.sh"]
          ports:
            - name: udp-2152
              protocol: UDP
              containerPort: 2152
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config-volume
              mountPath: /configuracoes
            - name: iptables-script
              mountPath: /free5gc/script
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-volume
          configMap:
            name: psa-upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: iptables-script
          configMap:
            name: psa-upf-iptables
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: psa-upf
  namespace: free5gc
  labels:
    app: free5gc-psa-upf
spec:
  selector:
    epc-mode: psa-upf
    app: free5gc-psa-upf
  ports:
    - name: udp-2152
      protocol: UDP
      port: 2152
      targetPort: 2152
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
---
