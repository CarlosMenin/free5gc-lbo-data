# SCENARIO B: CENTRAL PSA-UPF.
# Anchor of the default path (internet). It receives traffic from the I-UPF through N9 and
# allocates the IP of the UE. It is the "long path" against which the LBO is compared.
apiVersion: v1
kind: ConfigMap
metadata:
  name: psa-upf-config
  namespace: free5gc
data:
  upfConfig.yaml: |
    version: 1.0.3
    description: Central PSA-UPF (anchor of the default path) - Scenario B

    pfcp:
      addr: psa-upf-pod
      nodeID: psa-upf.free5gc.svc.cluster.local
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      # It only receives N9 (from the I-UPF), never N3 directly from the gNB.
      ifList:
        - addr: 0.0.0.0
          type: N9

    dnnList:
      - dnn: internet
        cidr: 60.60.0.0/16

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: psa-upf-iptables
  namespace: free5gc
data:
  upf-iptables.sh: |
    #!/bin/bash
    # WITHOUT THIS THE DATA PLANE DOES NOT WORK. The uplink packet arrives at upfgtp,
    # is decapsulated and must be ROUTED out through eth0 -- that is,
    # it is a forwarded packet, not one destined locally. With ip_forward=0 the
    # kernel drops it BEFORE the FORWARD chain, so the "iptables -I FORWARD
    # -j ACCEPT" below does not save it. The symptom is silent: RX grows in
    # /proc/net/dev of upfgtp, TX stays at zero and nothing comes back to the UE.
    # The free5gc/upf image does not bring the sysctl binary (procps); writing
    # directly to /proc works because the container is privileged.
    echo 1 > /proc/sys/net/ipv4/ip_forward

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    iptables -I FORWARD 1 -j ACCEPT
    iptables -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400

    ./upf -c /nf-config/upfConfig.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-psa-upf
  namespace: free5gc
  labels:
    epc-mode: psa-upf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: psa-upf
  template:
    metadata:
      labels:
        epc-mode: psa-upf
        app: free5gc-psa-upf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: psa-upf-pod
      # SERVER NODE (5G Core) -- the same machine as the control plane.
      #
      # Fig. 3 of the TG1 proposal draws a single box, "Server Node (5G Core)",
      # containing the Centralized Control Plane (AMF/SMF) AND the "User Plane -
      # Baseline: UPF (Centralized)". In the ULCL model of free5gc this centralized
      # UPF is exactly the PSA: the session anchors here, and the dUPF at the
      # edge only branches what goes to the MEC. That is why this pod stays with
      # the NFs, and not on a machine of its own.
      #
      # It is what makes the remote path cross the Backhaul/Transport Network
      # of the figure: from the Edge Node (<edge-subnet>) to here (<core-subnet>) the
      # packet crosses the campus router.
      #
      # The hardware here is much better than that of the dUPF at the edge (petshopboys:
      # 80 threads / 197 GB; brix: 4 threads / 3.8 GB). This does NOT invalidate the
      # measurement, but it defines how it must be read: the central anchor is being
      # charged in its best case, so the gain measured for the edge is a
      # FLOOR, not a ceiling. And it is faithful: an operator core runs on servers.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        #nodetype: server
      containers:
        - name: upf
          image: free5gc/upf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/free5gc/script/upf-iptables.sh"]
          ports:
            - name: udp-2152
              protocol: UDP
              containerPort: 2152
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config-volume
              mountPath: /nf-config
            - name: iptables-script
              mountPath: /free5gc/script
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-volume
          configMap:
            name: psa-upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: iptables-script
          configMap:
            name: psa-upf-iptables
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: psa-upf
  namespace: free5gc
  labels:
    app: free5gc-psa-upf
spec:
  selector:
    epc-mode: psa-upf
    app: free5gc-psa-upf
  ports:
    - name: udp-2152
      protocol: UDP
      port: 2152
      targetPort: 2152
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
---
