# CENARIO B: I-UPF (dUPF) na BORDA.
# Acumula dois papeis:
#   1) Branching point / Uplink Classifier (ULCL): classifica o trafego de uplink
#      e decide se ele sobe para o PSA central ou sai localmente;
#   2) PSA de borda para o trafego do MEC: e' aqui que o Local Breakout acontece
#      (por isso ele precisa de MASQUERADE, como um anchor de verdade).
apiVersion: v1
kind: ConfigMap
metadata:
  name: i-upf-config
  namespace: free5gc
data:
  upfConfig.yaml: |
    version: 1.0.3
    description: I-UPF (dUPF de borda) - branching point + LBO para o MEC

    pfcp:
      addr: i-upf-pod
      nodeID: i-upf.free5gc.svc.cluster.local
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      # 0.0.0.0 cobre N3 (vindo do gNB) e N9 (indo para o PSA central).
      # Necessario porque o go-upf so honra a PRIMEIRA entrada de ifList.
      ifList:
        - addr: 0.0.0.0
          type: N3

    # IMPORTANTE: o branching UPF precisa listar TODOS os pools de UE que
    # trafegam por ele, senao a rota para o pool nao e' instalada no gtp5g.
    # O pool 60.60.0.0/16 e' alocado pelo PSA-UPF central, mas passa por aqui.
    dnnList:
      - dnn: internet
        cidr: 60.60.0.0/16

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: i-upf-iptables
  namespace: free5gc
data:
  upf-iptables.sh: |
    #!/bin/bash
    # SEM ISTO O PLANO DE DADOS NAO ANDA. O pacote de uplink chega na upfgtp,
    # e' desencapsulado e precisa ser ROTEADO para fora pela eth0 -- ou seja,
    # e' um pacote encaminhado, nao destinado localmente. Com ip_forward=0 o
    # kernel o descarta ANTES da cadeia FORWARD, entao o "iptables -I FORWARD
    # -j ACCEPT" abaixo nao salva. O sintoma e' mudo: RX cresce em
    # /proc/net/dev da upfgtp, TX fica em zero e nada volta para o UE.
    # A imagem free5gc/upf nao traz o binario sysctl (procps); escrever
    # direto no /proc funciona porque o container e' privileged.
    echo 1 > /proc/sys/net/ipv4/ip_forward

    # Este UPF faz breakout local para o MEC, entao precisa de NAT: o servico
    # MEC responderia para 60.60.x.x (IP do UE) e nao saberia rotear de volta.
    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    iptables -I FORWARD 1 -j ACCEPT
    iptables -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400

    ./upf -c /configuracoes/upfConfig.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-i-upf
  namespace: free5gc
  labels:
    epc-mode: i-upf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: i-upf
  template:
    metadata:
      labels:
        epc-mode: i-upf
        app: free5gc-i-upf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: i-upf-pod
      # dUPF do EDGE NODE 1 (Figura 3 do TG1). Esta e' A peca da tese.
      #
      # O Edge Node do TG1 e' UM no com dUPF + LBO + MEC domain dentro. Por isso
      # este pod divide o brix-porvir-01 com o mec-app: o "traffic remains
      # within the local edge environment" da Secao 4.1 e' afirmacao sobre o
      # MESMO NO -- sob LBO o pacote nao chega a tocar um fio.
      #
      # O gNB/UE (UERANSIM) fica em brix-porvir-02, no mesmo switch mas FORA
      # desta caixa: o assinante nao mora dentro do host MEC, e a Figura 3
      # desenha "UE/RAN Emulation" como caixa separada. O "co-located with the
      # RAN" da Secao 1 continua valendo no sentido que a expressao tem em rede
      # de operadora -- mesmo sitio, mesmo switch, do lado de ca' do backhaul.
      #
      # Esta e' a variavel independente do experimento: no cenario A esta
      # funcao nao existe e a ancora fica em petshopboys (Server Node), do outro
      # lado do backhaul. Trocar o lugar da ancora -- e so' isso -- e' o que
      # responde a RQ (iii).
      #
      # O brix e' onde ha sudo, e este UPF precisa de root no NO, nao so' no
      # pod: o gtp5g e' modulo de kernel (modprobe gtp5g) e nao existe por
      # namespace de rede.
      #
      # Para um EDGE NODE 2 (a Figura 3 desenha dois), copie este arquivo com
      # nodeSelector em brix-porvir-03 (o -02 e' o UE/RAN) -- mas veja que nao
      # e' so' placement:
      # exige um segundo gNB, um segundo grupo de UEs no ueRouting.yaml e a
      # entrada correspondente em userplaneInformation/links do smf.yaml.
      nodeSelector:
        #kubernetes.io/arch: amd64
        kubernetes.io/hostname: brix-porvir-01
        #nodetype: server
      containers:
        - name: upf
          image: free5gc/upf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/free5gc/script/upf-iptables.sh"]
          ports:
            - name: udp-2152
              protocol: UDP
              containerPort: 2152
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config-volume
              mountPath: /configuracoes
            - name: iptables-script
              mountPath: /free5gc/script
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-volume
          configMap:
            name: i-upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: iptables-script
          configMap:
            name: i-upf-iptables
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: i-upf
  namespace: free5gc
  labels:
    app: free5gc-i-upf
spec:
  selector:
    epc-mode: i-upf
    app: free5gc-i-upf
  ports:
    - name: udp-2152
      protocol: UDP
      port: 2152
      targetPort: 2152
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
---
