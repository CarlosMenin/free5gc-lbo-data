# SCENARIO B: I-UPF (dUPF) at the EDGE.
# It has two roles:
#   1) Branching point / Uplink Classifier (ULCL): it classifies the uplink traffic
#      and decides whether it goes up to the central PSA or leaves locally;
#   2) Edge PSA for the MEC traffic: this is where the Local Breakout happens
#      (that is why it needs MASQUERADE, like a real anchor).
apiVersion: v1
kind: ConfigMap
metadata:
  name: i-upf-config
  namespace: free5gc
data:
  upfConfig.yaml: |
    version: 1.0.3
    description: I-UPF (edge dUPF) - branching point + LBO to the MEC

    pfcp:
      addr: i-upf-pod
      nodeID: i-upf.free5gc.svc.cluster.local
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      # 0.0.0.0 covers N3 (coming from the gNB) and N9 (going to the central PSA).
      # Needed because go-upf only honors the FIRST entry of ifList.
      ifList:
        - addr: 0.0.0.0
          type: N3

    # IMPORTANT: the branching UPF must list ALL UE pools that
    # go through it, otherwise the route to the pool is not installed in gtp5g.
    # The pool 60.60.0.0/16 is allocated by the central PSA-UPF, but it goes through here.
    dnnList:
      - dnn: internet
        cidr: 60.60.0.0/16

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: i-upf-iptables
  namespace: free5gc
data:
  upf-iptables.sh: |
    #!/bin/bash
    # WITHOUT THIS THE DATA PLANE DOES NOT WORK. The uplink packet arrives at upfgtp,
    # is decapsulated and must be ROUTED out through eth0 -- that is,
    # it is a forwarded packet, not one destined locally. With ip_forward=0 the
    # kernel drops it BEFORE the FORWARD chain, so the "iptables -I FORWARD
    # -j ACCEPT" below does not save it. The symptom is silent: RX grows in
    # /proc/net/dev of upfgtp, TX stays at zero and nothing comes back to the UE.
    # The free5gc/upf image does not bring the sysctl binary (procps); writing
    # directly to /proc works because the container is privileged.
    echo 1 > /proc/sys/net/ipv4/ip_forward

    # This UPF does local breakout to the MEC, so it needs NAT: the MEC
    # service would reply to 60.60.x.x (IP of the UE) and would not know how to route back.
    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    iptables -I FORWARD 1 -j ACCEPT
    iptables -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400

    ./upf -c /nf-config/upfConfig.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-i-upf
  namespace: free5gc
  labels:
    epc-mode: i-upf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: i-upf
  template:
    metadata:
      labels:
        epc-mode: i-upf
        app: free5gc-i-upf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: i-upf-pod
      # dUPF of EDGE NODE 1 (Fig. 3 of the TG1 proposal). This is THE key piece of the thesis.
      #
      # The Edge Node of the proposal is ONE node with dUPF + LBO + MEC domain inside. That is why
      # this pod shares brix-porvir-05 with mec-app: the "traffic remains
      # within the local edge environment" of Section 4.1 is a statement about the
      # SAME NODE -- under LBO the packet does not even touch a wire.
      #
      # The gNB/UE (UERANSIM) stays on brix-porvir-02, on the same switch but OUTSIDE
      # this box: the subscriber does not live inside the MEC host, and Fig. 3
      # draws "UE/RAN Emulation" as a separate box. The "co-located with the
      # RAN" of Section 1 still holds in the sense the expression has in an operator
      # network -- same site, same switch, on this side of the backhaul.
      #
      # This is the independent variable of the experiment: in Scenario A this
      # function does not exist and the anchor stays on petshopboys (Server Node), on the other
      # side of the backhaul. Changing the place of the anchor -- and only that -- is what
      # answers research question (iii) of the TG1 proposal.
      #
      # The brix is where there is sudo, and this UPF needs root on the NODE, not only in the
      # pod: gtp5g is a kernel module (modprobe gtp5g) and does not exist per
      # network namespace.
      #
      # For an EDGE NODE 2 (Fig. 3 draws two), copy this file with
      # nodeSelector on brix-porvir-03 (-02 is the UE/RAN) -- but note that it is not
      # only placement:
      # it requires a second gNB, a second group of UEs in ueRouting.yaml and the
      # corresponding entry in userplaneInformation/links of smf.yaml.
      nodeSelector:
        #kubernetes.io/arch: amd64
        kubernetes.io/hostname: brix-porvir-05
        #nodetype: server
      containers:
        - name: upf
          image: free5gc/upf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/free5gc/script/upf-iptables.sh"]
          ports:
            - name: udp-2152
              protocol: UDP
              containerPort: 2152
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config-volume
              mountPath: /nf-config
            - name: iptables-script
              mountPath: /free5gc/script
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-volume
          configMap:
            name: i-upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: iptables-script
          configMap:
            name: i-upf-iptables
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: i-upf
  namespace: free5gc
  labels:
    app: free5gc-i-upf
spec:
  selector:
    epc-mode: i-upf
    app: free5gc-i-upf
  ports:
    - name: udp-2152
      protocol: UDP
      port: 2152
      targetPort: 2152
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
---
