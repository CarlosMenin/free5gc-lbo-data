apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: free5gc
spec:
  ports:
    - name: mongo-27017
      protocol: TCP
      port: 27017
      targetPort: 27017
  selector:
    app: free5gc-mongodb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: free5gc-mongodb-pv-claim
  namespace: free5gc
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-mongodb
  namespace: free5gc
spec:
  selector:
    matchLabels:
      app: free5gc-mongodb   
  template:
    metadata:
      labels:
        app: free5gc-mongodb
        version: v4.4
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
      - image: free5gmano/nextepc-mongodb
        name: free5gc-mongodb
        ports:
        - containerPort: 27017
          name: mongodb
        #command: ["sleep", "1d"]
        volumeMounts:
        - name: mongodb-persistent-storage
          mountPath: /data
      volumes:
      - name: mongodb-persistent-storage
        persistentVolumeClaim:
          claimName: free5gc-mongodb-pv-claim

