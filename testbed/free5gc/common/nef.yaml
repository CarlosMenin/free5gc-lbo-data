# NEF (Network Exposure Function) -- entry point of the DYNAMIC LBO.
#
# The AF of the testbed (mec/mec-af.yaml) publishes Traffic Influence
# subscriptions here (TS 29.522, /3gpp-traffic-influence/v1). The NEF writes the
# rule to the UDR (application-data/influenceData); the PCF, which subscribes to
# the UDR per PDU session, receives the notification and sends an
# SmPolicyUpdateNotify to the SMF; the SMF selects the UPF by the DNAI ("mec",
# declared in the I-UPF of Scenario B) and installs the ULCL branch by PFCP
# Session Modification -- in sessions already open and in new ones, restarting
# nothing.
#
# It is used only by mec-af. No other NF depends on it: if it goes down, the core
# stays up and what is lost is the ability to ANNOUNCE new rules (the ones already
# written to the UDR still apply).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nef-config
  namespace: free5gc
data:
  nefConfig.yaml: |
    info:
      version: 1.0.1
      description: NEF initial local configuration
    configuration:
      sbi:
        scheme: http
        registerIPv4: nef.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/nef.pem
          key: cert/nef.key
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      serviceList:
        - serviceName: 3gpp-traffic-influence
        - serviceName: nnef-oam
        - serviceName: nnef-callback

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-nef
  namespace: free5gc
  labels:
    epc-mode: nef
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: nef
  template:
    metadata:
      labels:
        epc-mode: nef
        app: free5gc-nef
        version: v4.2.3
    spec:
      hostname: nef-pod
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: nef
          image: free5gc/nef:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./nef", "-c", "/nf-config/nefConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
          volumeMounts:
            - name: config-volume
              mountPath: /nf-config
      volumes:
        - name: config-volume
          configMap:
            name: nef-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: nef
  namespace: free5gc
  labels:
    app: free5gc-nef
spec:
  selector:
    epc-mode: nef
    app: free5gc-nef
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
