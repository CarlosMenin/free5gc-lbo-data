# NEF (Network Exposure Function) -- porta de entrada do LBO DINAMICO.
#
# O AF do testbed (mec/mec-af.yaml) publica aqui assinaturas de Traffic
# Influence (TS 29.522, /3gpp-traffic-influence/v1). O NEF grava a regra no
# UDR (application-data/influenceData); o PCF, que se inscreve no UDR por
# sessao PDU, recebe a notificacao e manda um SmPolicyUpdateNotify ao SMF; o
# SMF seleciona o UPF pelo DNAI ("mec", declarado no I-UPF do cenario B) e
# instala o branch ULCL por PFCP Session Modification -- em sessoes ja'
# abertas e nas novas, sem reiniciar nada.
#
# So' e' consumido pelo mec-af. Nenhum outro NF depende dele: se ele cair, o
# core segue de pe' e o que se perde e' a capacidade de ANUNCIAR regras novas
# (as ja' gravadas no UDR continuam valendo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nef-config
  namespace: free5gc
data:
  nefConfig.yaml: |
    info:
      version: 1.0.1
      description: NEF initial local configuration
    configuration:
      sbi:
        scheme: http
        registerIPv4: nef.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          pem: cert/nef.pem
          key: cert/nef.key
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      serviceList:
        - serviceName: 3gpp-traffic-influence
        - serviceName: nnef-oam
        - serviceName: nnef-callback

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-nef
  namespace: free5gc
  labels:
    epc-mode: nef
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: nef
  template:
    metadata:
      labels:
        epc-mode: nef
        app: free5gc-nef
        version: v4.2.3
    spec:
      hostname: nef-pod
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: nef
          image: free5gc/nef:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["./nef", "-c", "/configuracoes/nefConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
          volumeMounts:
            - name: config-volume
              mountPath: /configuracoes
      volumes:
        - name: config-volume
          configMap:
            name: nef-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: nef
  namespace: free5gc
  labels:
    app: free5gc-nef
spec:
  selector:
    epc-mode: nef
    app: free5gc-nef
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
