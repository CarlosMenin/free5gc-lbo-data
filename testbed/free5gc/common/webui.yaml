apiVersion: v1
kind: ConfigMap
metadata:
  name: webui-config
  namespace: free5gc
data:
  webuiConfig.yaml: |
    # ATENCAO (migracao v3.3.0 -> v4.2.3):
    #   - info.version passou de 1.0.1 para 1.0.3
    #   - novos blocos nrfUri e webServer
    info:
      version: 1.0.3
      description: WebUI initial local configuration

    configuration:
      mongodb:
        name: free5gc
        url: mongodb://mongo:27017
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      webServer:
        scheme: http
        ipv4Address: 0.0.0.0
        port: 5000
      # v4.2.3: o bloco billingServer e OBRIGATORIO e `enable` e validado com
      # govalidator `required`, que rejeita o zero-value. Ou seja, `enable: false`
      # faz o webui abortar com "invalid BillingServer.Enable: non zero value
      # required". Tem que ficar `true` (igual ao webuicfg.yaml de referencia).
      billingServer:
        enable: true
        hostIPv4: 127.0.0.1
        listenPort: 2121
        portRange:
          start: 2123
          end: 2130
        basePath: /tmp/webconsole
        port: 2122
        cert:
          pem: cert/chf.pem
          key: cert/chf.key

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-webui
  namespace: free5gc
  labels:
    epc-mode: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: webui
  template:
    metadata:
      labels:
        epc-mode: webui
        app: free5gc-webui
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: webui-pod
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: webui
          image: free5gc/webui:v4.2.3
          imagePullPolicy: IfNotPresent
          # O binario dentro da imagem free5gc/webui chama-se "webui"
          # (o Dockerfile renomeia webconsole -> webui).
          command: ["./webui", "-c", "/configuracoes/webuiConfig.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-5000
              protocol: TCP
              containerPort: 5000
          volumeMounts:
            - name: config-volume
              mountPath: /configuracoes
      volumes:
        - name: config-volume
          configMap:
            name: webui-config
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: free5gc
  labels:
    app: free5gc-webui
spec:
  type: NodePort
  selector:
    epc-mode: webui
    app: free5gc-webui
  ports:
    - name: http2-5000
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500
---
