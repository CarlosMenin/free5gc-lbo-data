# SCENARIO A (baseline): SMF with a single centralized UPF, WITHOUT ULCL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smf-config
  namespace: free5gc
data:
  smfConfig.yaml: |
    info:
      version: 1.0.7
      description: SMF - Scenario A (centralized UPF)

    configuration:
      smfName: SMF
      sbi:
        scheme: http
        registerIPv4: smf.free5gc.svc.cluster.local
        bindingIPv4: 0.0.0.0
        port: 8000
        tls:
          key: cert/smf.key
          pem: cert/smf.pem
      serviceNameList:
        - nsmf-pdusession
        - nsmf-event-exposure
        - nsmf-oam
        - nsmf-callback   # NEW in v4.x
      snssaiInfos:
        - sNssai:
            sst: 1
            sd: 010203
          dnnInfos:
            - dnn: internet
              dns:
                ipv4: 10.96.0.10
                ipv6: 2001:4860:4860::8888
        - sNssai:
            sst: 1
            sd: 112233
          dnnInfos:
            - dnn: internet
              dns:
                ipv4: 10.96.0.10
                ipv6: 2001:4860:4860::8888
      plmnList:
        - mcc: 208
          mnc: 93
      locality: area1
      pfcp:
        nodeID: smf.free5gc.svc.cluster.local
        listenAddr: 0.0.0.0
        externalAddr: smf.free5gc.svc.cluster.local
        heartbeatInterval: 5s
      userplaneInformation:
        upNodes:
          gNB1:
            type: AN
          UPF:
            type: UPF
            nodeID: upf.free5gc.svc.cluster.local
            addr: upf.free5gc.svc.cluster.local
            # The SMF checks pool overlap GLOBALLY (isOverlap over
            # allUEIPPools in internal/context/user_plane_information.go): it
            # does NOT separate by S-NSSAI. Declaring 60.60.0.0/16 in both slices
            # aborts the boot with "overlap cidr value between UPFs". That is why the
            # /16 is split into two disjoint /17 - both stay inside the
            # cidr 60.60.0.0/16 of the upfcfg, so the route/NAT of the UPF does not change.
            sNssaiUpfInfos:
              - sNssai:
                  sst: 1
                  sd: 010203
                dnnUpfInfoList:
                  - dnn: internet
                    pools:
                      - cidr: 60.60.0.0/17
              - sNssai:
                  sst: 1
                  sd: 112233
                dnnUpfInfoList:
                  - dnn: internet
                    pools:
                      - cidr: 60.60.128.0/17
            interfaces:
              # endpoints CANNOT be 0.0.0.0: this address goes in the F-TEID
              # handed to the gNB, so it must be routable.
              - interfaceType: N3
                endpoints:
                  - upf.free5gc.svc.cluster.local
                networkInstances:
                  - internet
        links:
          - A: gNB1
            B: UPF
      t3591:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      t3592:
        enable: true
        expireTime: 16s
        maxRetryTimes: 3
      nrfUri: http://nrf.free5gc.svc.cluster.local:8000
      # URR (Usage Reporting Rules) -- what the UPF reports to the SMF for charging.
      #
      # The example values of free5gc (urrThreshold: 1000, in BYTES) make the
      # UPF send a PFCP Usage Report every 1000 bytes of traffic. In a ping
      # demo this is harmless; under the VR load it is fatal:
      #
      #     6 Mbps  ->    ~750 reports/s
      #    50 Mbps  ->   ~6250 reports/s
      #
      # Measured: 27,814 USA Reports on a single I-UPF. The SMF does not
      # sustain this volume of PFCP transactions, the sequence numbers
      # collide ("Sequence number 99911 already exist!"), the association with the
      # UPF DROPS ("UPF[...] not associated with SMF"), the data plane dies and
      # new PDU sessions start to fail. The SMF even panics in the
      # HTTP handler. This was the cause of the remote path "stopping by itself" in
      # the middle of the campaigns.
      #
      # And none of this serves any purpose here: there is no CHF in the testbed
      # ("chf selection error: no CHF found in CHFSelection"), so the report
      # is produced, carried and dropped. The thresholds below keep the URR
      # existing (free5gc needs the URR to build the session) without it
      # firing during a campaign.
      urrPeriod: 3600
      urrThreshold: 1000000000
      requestedUnit: 1000000000

      metrics:
        enable: true
        scheme: http
        bindingIPv4: 0.0.0.0
        port: 9091
        namespace: free5gc

    logger:
      enable: true
      level: info
      reportCaller: false
---
# The SMF reads the ueRouting file UNCONDITIONALLY at boot (cmd/main.go calls
# factory.ReadUERoutingConfig before anything else; there is no ulcl check).
# Without -u it falls back to the default "./config/uerouting.yaml", which does not
# exist in the image, and aborts with:
#     SMF Run error: ReadConfig [] Error: open ./config/uerouting.yaml: no such
#     file or directory
# That is: even without ULCL, Scenario A needs a file. This one is empty on
# purpose -- "ueRoutingInfo" is valid:"optional", so a valid "info" is enough,
# and with ulcl absent (false) InitSMFUERouting does not even look at the content.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ue-routing-info
  namespace: free5gc
data:
  ueRouting.yaml: |
    info:
      version: 1.0.7
      description: UE routing - Scenario A (no ULCL, empty file)

    ueRoutingInfo: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-smf
  namespace: free5gc
  labels:
    epc-mode: smf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: smf
  template:
    metadata:
      labels:
        epc-mode: smf
        app: free5gc-smf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: smf-pod
      # SERVER NODE (5G Core), together with the rest of the Centralized Control Plane and
      # EQUAL to the SMF of Scenario B (scenario-b-dupf/smf.yaml). The A x B comparison
      # only holds if the only thing that changes between the two is the USER
      # PLANE -- leaving the SMF of Scenario A on a node other than that of B introduces
      # a signaling difference (N4 to the UPF, N11 to the AMF) that has
      # nothing to do with the question.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: smf
          image: free5gc/smf:v4.2.3
          imagePullPolicy: IfNotPresent
          # -u is mandatory even without ULCL: the SMF reads the file at boot
          # regardless of the flag. See the comment in the ue-routing-info ConfigMap.
          command: ["./smf", "-c", "/nf-config/smfConfig.yaml", "-u", "/free5gc/ue/ueRouting.yaml"]
          env:
            - name: GIN_MODE
              value: release
          ports:
            - name: http2-8000
              protocol: TCP
              containerPort: 8000
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
            - name: metrics-9091
              protocol: TCP
              containerPort: 9091
          volumeMounts:
            - name: config-volume
              mountPath: /nf-config
            - name: config-uerouting
              mountPath: /free5gc/ue
      volumes:
        - name: config-volume
          configMap:
            name: smf-config
            defaultMode: 0777
        - name: config-uerouting
          configMap:
            name: ue-routing-info
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: free5gc
  labels:
    app: free5gc-smf
spec:
  selector:
    epc-mode: smf
    app: free5gc-smf
  ports:
    - name: http2-8000
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
    - name: metrics-9091
      protocol: TCP
      port: 9091
      targetPort: 9091
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: free5gc-smf
  namespace: free5gc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: free5gc-smf
  endpoints:
    - interval: 15s
      port: metrics-9091
      path: /metrics
---
