# CENARIO A (baseline): UPF unico e CENTRALIZADO.
# Todo o trafego do UE atravessa o backhaul ate o nucleo antes de chegar
# a qualquer servico -- inclusive ao servico MEC que fica na borda.
apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-config
  namespace: free5gc
data:
  upfConfig.yaml: |
    version: 1.0.3
    description: UPF centralizado (PSA unico) - cenario A

    pfcp:
      # NAO pode ser 0.0.0.0. Usa o hostname do pod (resolve via /etc/hosts).
      addr: upf-pod
      nodeID: upf.free5gc.svc.cluster.local
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      # NOTA (go-upf v4.2.3): o forwarder usa APENAS a PRIMEIRA entrada de ifList
      # (internal/forwarder/driver.go faz break no primeiro item). Listar varios
      # enderecos nao tem efeito -- por isso usamos 0.0.0.0, que cobre N3 e N9.
      ifList:
        - addr: 0.0.0.0
          type: N3

    # Cada CIDR aqui vira uma rota instalada na interface gtp5g.
    dnnList:
      - dnn: internet
        cidr: 60.60.0.0/16

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-iptables
  namespace: free5gc
data:
  upf-iptables.sh: |
    #!/bin/bash
    # SEM ISTO O PLANO DE DADOS NAO ANDA. O pacote de uplink chega na upfgtp,
    # e' desencapsulado e precisa ser ROTEADO para fora pela eth0 -- ou seja,
    # e' um pacote encaminhado, nao destinado localmente. Com ip_forward=0 o
    # kernel o descarta ANTES da cadeia FORWARD, entao o "iptables -I FORWARD
    # -j ACCEPT" abaixo nao salva. O sintoma e' mudo: RX cresce em
    # /proc/net/dev da upfgtp, TX fica em zero e nada volta para o UE.
    # A imagem free5gc/upf nao traz o binario sysctl (procps); escrever
    # direto no /proc funciona porque o container e' privileged.
    echo 1 > /proc/sys/net/ipv4/ip_forward

    # MASQUERADE e' obrigatorio: sem ele as respostas do DN nao sabem voltar
    # para o pool de IP do UE (60.60.0.0/16).
    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    iptables -I FORWARD 1 -j ACCEPT
    iptables -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400

    ./upf -c /configuracoes/upfConfig.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-upf
  namespace: free5gc
  labels:
    epc-mode: upf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: upf
  template:
    metadata:
      labels:
        epc-mode: upf
        app: free5gc-upf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: upf-pod
      # SERVER NODE (5G Core). Na Figura 3 do TG1 este e' o bloco "User Plane -
      # Baseline: UPF (Centralized)", DENTRO da mesma caixa do Centralized
      # Control Plane -- por isso ele fica na maquina dos NFs, e nao numa
      # propria. O ponto do baseline e' justamente estar do outro lado do
      # Backhaul/Transport Network em relacao ao Edge Node.
      #
      # E' este UPF que produz o "trombone" do cenario A: o trafego do UE sai
      # do Edge Node, cruza o backhaul ate' aqui, e VOLTA para o MEC domain na
      # borda. Mesmo destino do cenario B, caminho completamente diferente --
      # e' a comparacao que a Secao 4.4 do TG1 define.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: upf
          image: free5gc/upf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/free5gc/script/upf-iptables.sh"]
          ports:
            - name: udp-2152
              protocol: UDP
              containerPort: 2152
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config-volume
              mountPath: /configuracoes
            - name: iptables-script
              mountPath: /free5gc/script
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-volume
          configMap:
            name: upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: iptables-script
          configMap:
            name: upf-iptables
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: free5gc
  labels:
    app: free5gc-upf
spec:
  selector:
    epc-mode: upf
    app: free5gc-upf
  ports:
    - name: udp-2152
      protocol: UDP
      port: 2152
      targetPort: 2152
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
---
