# SCENARIO A (baseline): single and CENTRALIZED UPF.
# All traffic of the UE crosses the backhaul to the core before reaching
# any service -- including the MEC service that is at the edge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-config
  namespace: free5gc
data:
  upfConfig.yaml: |
    version: 1.0.3
    description: Centralized UPF (single PSA) - Scenario A

    pfcp:
      # It CANNOT be 0.0.0.0. It uses the hostname of the pod (resolved through /etc/hosts).
      addr: upf-pod
      nodeID: upf.free5gc.svc.cluster.local
      retransTimeout: 1s
      maxRetrans: 3

    gtpu:
      forwarder: gtp5g
      # NOTE (go-upf v4.2.3): the forwarder uses ONLY the FIRST entry of ifList
      # (internal/forwarder/driver.go breaks at the first item). Listing several
      # addresses has no effect -- that is why we use 0.0.0.0, which covers N3 and N9.
      ifList:
        - addr: 0.0.0.0
          type: N3

    # Each CIDR here becomes a route installed on the gtp5g interface.
    dnnList:
      - dnn: internet
        cidr: 60.60.0.0/16

    logger:
      enable: true
      level: info
      reportCaller: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-iptables
  namespace: free5gc
data:
  upf-iptables.sh: |
    #!/bin/bash
    # WITHOUT THIS THE DATA PLANE DOES NOT WORK. The uplink packet arrives at upfgtp,
    # is decapsulated and must be ROUTED out through eth0 -- that is,
    # it is a forwarded packet, not one destined locally. With ip_forward=0 the
    # kernel drops it BEFORE the FORWARD chain, so the "iptables -I FORWARD
    # -j ACCEPT" below does not save it. The symptom is silent: RX grows in
    # /proc/net/dev of upfgtp, TX stays at zero and nothing comes back to the UE.
    # The free5gc/upf image does not bring the sysctl binary (procps); writing
    # directly to /proc works because the container is privileged.
    echo 1 > /proc/sys/net/ipv4/ip_forward

    # MASQUERADE is mandatory: without it the replies from the DN do not know how to go
    # back to the IP pool of the UE (60.60.0.0/16).
    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
    iptables -I FORWARD 1 -j ACCEPT
    iptables -A FORWARD -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1400

    ./upf -c /nf-config/upfConfig.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-upf
  namespace: free5gc
  labels:
    epc-mode: upf
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: upf
  template:
    metadata:
      labels:
        epc-mode: upf
        app: free5gc-upf
        version: v4.2.3
        prometheus: free5gc-monitor
    spec:
      hostname: upf-pod
      # SERVER NODE (5G Core). In Fig. 3 of the TG1 proposal this is the block "User Plane -
      # Baseline: UPF (Centralized)", INSIDE the same box as the Centralized
      # Control Plane -- that is why it stays on the machine of the NFs, and not on one
      # of its own. The point of the baseline is precisely to be on the other side of the
      # Backhaul/Transport Network with respect to the Edge Node.
      #
      # It is this UPF that produces the "trombone" of Scenario A: the traffic of the UE leaves
      # the Edge Node, crosses the backhaul to here, and comes BACK to the MEC domain at the
      # edge. Same destination as Scenario B, a completely different path --
      # it is the comparison that Section 4.4 of the TG1 proposal defines.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        nodetype: server
      containers:
        - name: upf
          image: free5gc/upf:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "/free5gc/script/upf-iptables.sh"]
          ports:
            - name: udp-2152
              protocol: UDP
              containerPort: 2152
            - name: udp-8805
              protocol: UDP
              containerPort: 8805
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
          volumeMounts:
            - name: config-volume
              mountPath: /nf-config
            - name: iptables-script
              mountPath: /free5gc/script
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-volume
          configMap:
            name: upf-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
        - name: iptables-script
          configMap:
            name: upf-iptables
            defaultMode: 0777
---
apiVersion: v1
kind: Service
metadata:
  name: upf
  namespace: free5gc
  labels:
    app: free5gc-upf
spec:
  selector:
    epc-mode: upf
    app: free5gc-upf
  ports:
    - name: udp-2152
      protocol: UDP
      port: 2152
      targetPort: 2152
    - name: udp-8805
      protocol: UDP
      port: 8805
      targetPort: 8805
---
