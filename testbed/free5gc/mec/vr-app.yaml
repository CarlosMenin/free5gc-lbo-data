                    self.sock.sendto(pkt, self.dst)
                    self.tx_packets += 1
                    self.tx_bytes += len(pkt)
                except OSError as exc:
                    print(f"erro de envio: {exc}", file=sys.stderr)
                sleep = next_t - time.perf_counter()
                if sleep > 0:
