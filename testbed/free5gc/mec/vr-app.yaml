                pass
            self.running = False

        # ------------------------------------------------------------------ RX
        def rx_loop(self):
            recv_into = self.sock.recvmsg_into
            seen_ = [memoryview(self.rxbuf)]
            buf = self.rxbuf
            warmup_ns = int(self.args.warmup * 1e9)
