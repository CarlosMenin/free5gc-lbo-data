                       help="intervalo minimo entre rajadas. Abaixo disso o "
                            "time.sleep() do Linux erra mais do que o intervalo "
                            "pedido; o tamanho da rajada e' derivado deste piso")
        p.add_argument("--session-timeout", type=float,
