# EDGE MEC service (target of the Local Breakout) and its remote counterpart.
#
# Each pod runs two load generators:
#
#   iperf      (5001)  raw saturation -- throughput ceiling, no closed loop.
#   vr-server  (9100)  VR application: heavy downlink of "frames"
#                      closed in a loop with the pose/control uplink.
#                      Prometheus metrics on 9101. Code in
#                      testbed/mec-vr/, mounted through the vr-app ConfigMap.
#
# The two coexist because they measure different things: iperf answers "how much
# fits", vr-server answers "how long the closed loop takes" -- which is the
# question of the experiment. Run one at a time in the campaigns.
#
# The ClusterIP is NOT fixed: mec-af (mec/mec-af.yaml) resolves this Service by its
# DNS name and announces to the NEF the IP that k8s allocated; the core carries the
# rule to the I-UPF by Traffic Influence (NEF -> UDR -> PCF -> SMF). Changing the IP
# or recreating the Service requires touching no config of the core and no restart
# of the SMF. To announce ANOTHER service, add its name to SERVICES in
# mec-af.yaml.
apiVersion: v1
kind: Service
metadata:
  name: mec-app
  namespace: free5gc
  labels:
    app: free5gc-mec-app
spec:
  selector:
    epc-mode: mec-app
  ports:
    - name: tcp-5001
      protocol: TCP
      port: 5001
      targetPort: 5001
    - name: udp-5001
      protocol: UDP
      port: 5001
      targetPort: 5001
    - name: udp-9100
      protocol: UDP
      port: 9100
      targetPort: 9100
    - name: metrics-9101
      protocol: TCP
      port: 9101
      targetPort: 9101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-mec-app
  namespace: free5gc
  labels:
    epc-mode: mec-app
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: mec-app
  template:
    metadata:
      labels:
        epc-mode: mec-app
        app: free5gc-mec-app
        prometheus: free5gc-monitor
    spec:
      # MEC DOMAIN of EDGE NODE 1 (Fig. 3 of the TG1 proposal).
      #
      # The proposal draws the Edge Node as ONE node, with dUPF + LBO + MEC domain
      # (AI-on-RAN + Edge Applications) inside. That is why this pod stays on the SAME
      # node as the I-UPF -- brix-porvir-05. Separating the MEC from the dUPF that does
      # the breakout would be a topology different from the proposal.
      #
      # Direct consequence: under LBO the packet leaves the dUPF and arrives here WITHOUT
      # touching a wire. This is what Fig. 2 means by "traffic remains
      # within the local edge environment".
      #
      # The tester (UERANSIM) is NOT here, on purpose: the subscriber does not live
      # inside the MEC host. It stays on brix-porvir-02, on the same switch but outside
      # the Edge Node -- see the comment in tester/ueransim.yaml. This also frees
      # the 2 physical cores of this brix for gtp5g and vr-server,
      # which was the bottleneck measured in the 100 Mbps profile (the server
      # sustained 53 of the 90 fps when it shared the node with the gNB and the UE).
      #
      # The brix is also the only node with sudo, and vr-server depends on it:
      # net.core.rmem_max/wmem_max are GLOBAL sysctls of the node, they do not exist per
      # network namespace, and without raising them the request for an 8 MB buffer is
      # cut silently (see the PACING block below).
      nodeSelector:
        #kubernetes.io/arch: amd64
        kubernetes.io/hostname: brix-porvir-05
        #nodetype: server
      volumes:
        - name: vr-app
          configMap:
            name: vr-app
      containers:
        - name: iperf
          image: mlabbe/iperf:latest
          ports:
            - name: tcp-5001
              protocol: TCP
              containerPort: 5001
            - name: udp-5001
              protocol: UDP
              containerPort: 5001
          command: ["iperf", "-s", "-p", "5001"]
        - name: vr-server
          image: python:3.12-slim
          command: ["python3", "-u", "/opt/vr/vr_server.py"]
          ports:
            - name: udp-9100
              protocol: UDP
              containerPort: 9100
            - name: metrics-9101
              protocol: TCP
              containerPort: 9101
          env:
            # PACING (VR_SPREAD): on by default since the change in
            # vr_server. The frame leaves in small bursts spread over the
            # period, instead of all packets at once. A frame of
            # 50 Mbps at 60 fps is 87 packets (~104 kB) that, in a burst, leave at
            # the speed of the veth -- no queue on the path (socket of the client,
            # nr-gnb, nr-ue) absorbs that, and what overflows becomes "loss" that is
            # actually burst. This is what stalls the heavier loads.
            #   VR_PACE_DUTY  fraction of the period used for spreading (0.8)
            #   VR_SPREAD=0   back to the old behavior (a single burst)
            # The cost of the pacing enters the hold and, as a consequence, the m2p --
            # EQUAL on both paths, and net_rtt (which subtracts the hold) does not
            # change. The report has the hold in its own column for this reason.
            #
            # BEFORE RAISING THE LOAD, check on the NODE (not in the pod: they are global
            # sysctls, they do not exist per network namespace):
            #   sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216
            # Without it the request for 8 MB of SO_RCVBUF/SO_SNDBUF is cut to
            # ~416 kB silently, and the resulting loss enters the report as
            # if it belonged to the UPF path.
            - name: VR_ROLE
              value: "mec"
            - name: VR_PROFILE
              value: "heavy"
            - name: VR_BITRATE_MBPS
              value: "50"
            - name: VR_FPS
              value: "90"
            - name: VR_MTU
              value: "1200"
            - name: VR_RENDER_MS
              value: "0"
            # - name: VR_AI_URL
            #   value: "http://jetson-ai.free5gc.svc.cluster.local:8080/infer"
          volumeMounts:
            - name: vr-app
              mountPath: /opt/vr
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9101
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: free5gc-mec-app
  namespace: free5gc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: free5gc-mec-app
  endpoints:
    - interval: 15s
      port: metrics-9101
      path: /metrics
---
# REMOTE service (central data network), representing the cloud/distant service.
# It is the counterpart: in Scenario B, the traffic to it keeps going up
# to the central PSA-UPF, while the traffic to mec-app leaves at the edge.
#
# No fixed ClusterIP and OUTSIDE SERVICES in mec-af: if it were announced,
# it would also leave at the edge and the contrast of the measurement would disappear.
# The campaign scripts find the IP with 'kubectl get svc remote-app'.
apiVersion: v1
kind: Service
metadata:
  name: remote-app
  namespace: free5gc
  labels:
    app: free5gc-remote-app
spec:
  selector:
    epc-mode: remote-app
  ports:
    - name: tcp-5001
      protocol: TCP
      port: 5001
      targetPort: 5001
    - name: udp-5001
      protocol: UDP
      port: 5001
      targetPort: 5001
    - name: udp-9100
      protocol: UDP
      port: 9100
      targetPort: 9100
    - name: metrics-9101
      protocol: TCP
      port: 9101
      targetPort: 9101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-remote-app
  namespace: free5gc
  labels:
    epc-mode: remote-app
spec:
  replicas: 1
  selector:
    matchLabels:
      epc-mode: remote-app
  template:
    metadata:
      labels:
        epc-mode: remote-app
        app: free5gc-remote-app
        prometheus: free5gc-monitor
    spec:
      # CORE (<core-subnet>, on the other side of the router). Counterpart of
      # mec-app: same image, same profile, same configuration -- the ONLY
      # difference between the two paths must be where the traffic leaves the
      # user plane.
      #
      # REMOTE SERVICE, on the other side of the Backhaul/Transport Network.
      #
      # It does not appear as a box in Fig. 3 of the TG1 proposal -- both figures only
      # draw the MEC domain as a destination. It comes from the text of Section 4.1:
      # "non-local traffic can still traverse the transport network towards
      # remote services". It is what proves that the ULCL is CLASSIFYING, and not
      # sending everything to the edge: the same UE, in the same PDU session, with two
      # destinations that take different paths.
      #
      # metallica and NOT petshopboys: petshopboys is the Server Node (5G Core), and
      # the remote service is not part of the core -- it is reached THROUGH the
      # core. Putting it on the same node as the anchor would give the remote path a free
      # N6 hop that the edge path pays for.
      #
      # CAUTION when reading the result: here there is NO sudo to raise
      # net.core.rmem_max/wmem_max. The node grants ~416 kB against the 8 MB
      # requested, and it is on the remote side that UDP queue overflows show up
      # first when the load rises. A very different loss between the two
      # paths invalidates the comparison (the health guard of step 12 rejects the
      # execution) -- it is not a result of the LBO, it is the buffer.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: metallica
        #nodetype: server
      volumes:
        - name: vr-app
          configMap:
            name: vr-app
      containers:
        - name: iperf
          image: mlabbe/iperf:latest
          ports:
            - name: tcp-5001
              protocol: TCP
              containerPort: 5001
            - name: udp-5001
              protocol: UDP
              containerPort: 5001
          command: ["iperf", "-s", "-p", "5001"]
        - name: vr-server
          image: python:3.12-slim
          command: ["python3", "-u", "/opt/vr/vr_server.py"]
          ports:
            - name: udp-9100
              protocol: UDP
              containerPort: 9100
            - name: metrics-9101
              protocol: TCP
              containerPort: 9101
          env:
            # SAME profile as mec-app -- the only difference between the two
            # paths must be the place where the traffic leaves the user plane.
            - name: VR_ROLE
              value: "remote"
            - name: VR_PROFILE
              value: "heavy"
            - name: VR_BITRATE_MBPS
              value: "50"
            - name: VR_FPS
              value: "90"
            - name: VR_MTU
              value: "1200"
            - name: VR_RENDER_MS
              value: "0"
          volumeMounts:
            - name: vr-app
              mountPath: /opt/vr
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9101
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: free5gc-remote-app
  namespace: free5gc
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: free5gc-remote-app
  endpoints:
    - interval: 15s
      port: metrics-9101
      path: /metrics
