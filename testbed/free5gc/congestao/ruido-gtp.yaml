# Trafego de fundo PELO PLANO DE USUARIO (ideia do orientador, 25/09/2026).
#
# O congestao/iperf.yaml congestiona o transporte com um iperf que nao passa
# por UPF nenhuma. Aqui o fundo e' trafego de ASSINANTE: um segundo UERANSIM
# (gNB + UE) no brix-porvir-03 abre a propria sessao PDU, e o iperf3 desce
# ate' ele pelo tunel GTP-U:
#
#   ruido-gerador (petshopboys) --N6--> UPF de ancoragem --N3/GTP-U--> gNB de ruido (brix-03)
#                                       A: upf  |  B: psa-upf
#
# E' o que outros usuarios da rede fazem com o nucleo: o fundo passa pela UPF
# central (no A ela e' a MESMA do experimento) e desce o backhaul encapsulado.
# No B o UE de ruido e' de OUTRA celula, sem dUPF: ancora no PSA-UPF e recebe o
# N3 direto dele -- nao toca o Edge Node (brix-01).
#
# Quem garante esse caminho e' a FATIA: o UE de ruido usa sst 1 / sd 112233,
# que no scenario-b-dupf/smf.yaml so' o PSA-UPF atende (o I-UPF ficou so' com a
# 010203, a do experimento). Na 010203 ele cairia no caminho gNB -> I-UPF ->
# PSA-UPF e o fundo passaria pela borda. No cenario A a UPF central atende as
# duas fatias e nada muda. O mec-af anuncia o mec-app so' na 010203.
#
# COMO O FUNDO ENTRA NA SESSAO: iperf3 em modo reverso (-R). O cliente roda no
# pod de ruido, preso ao IP do UE (-B), e abre o controle por DENTRO do tunel;
# o servidor, no ruido-gerador, e' quem envia o UDP. O pacote de ida sai da
# UPF mascarado (MASQUERADE do upf-iptables.sh), entao a resposta volta para a
# UPF, que a devolve ao UE pelo tunel. Nao ha' rota para 60.60.0.0/16 fora do
# pod da UPF -- mandar direto para o IP do UE nao chegaria.
#
# O UERANSIM NAO ABSORVE ESSA TAXA. Ele sustenta 50-100 Mbps por sessao
# (campanha de 08/09/2026), e pior: a fila entre a thread que le o socket
# GTP-U e a task GTP do nr-gnb e' uma std::deque SEM LIMITE (NtsTask::push em
# src/utils/nts.cpp). A ~800 Mbps a leitura empilha mais rapido do que a task
# consome e a memoria do gNB cresce ate' o OOM do brix. Por isso o container
# 'iperf' instala no netns do pod um descarte do excedente ANTES do UERANSIM
# (chain RUIDO-GTPU): o pacote ja' cruzou o enlace quando e' descartado, que e'
# o que interessa para a congestao; ao UERANSIM chegam so' ~2000 pps grandes e
# todos os pacotes pequenos (controle do iperf, TCP). Os contadores dessa chain
# sao a medida do fundo que cruzou o enlace.
#
# Tamanho do datagrama (1356 B, nos scripts): o pacote GTP-U no fio fica com
# 1428 B de IP -- o MESMO tamanho do datagrama de 1400 B do fundo direto --
# e cabe no MTU 1450 do VXLAN do Calico sem fragmentar:
#     1356 + 8 UDP + 20 IP (interno) + 16 GTP-U + 8 UDP + 20 IP (externo) = 1428
#
# Aplicado pelo piloto e pela campanha (--ruido gtp) e por scripts/ruido-gtp.py.
#
# O UE de ruido (imsi-208930000090000) fica FORA do intervalo que o
# insere-dados.py grava por padrao, e os scripts o cadastram a parte, com AMBR
# alto: a AMBR de sessao padrao do insere-dados.py (100 Mbps no downlink) viraria
# teto do fundo se o QoS do gtp5g estiver ligado no no (/proc/gtp5g/qos).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ruido-ueransim-config
  namespace: free5gc
data:
  # Mesmo gnb.yaml do tester (tester/ueransim.yaml), com OUTRO gNB ID: 0x20
  # com idLength 32 = gNB ID 2 (o tester e' o 0x10 = gNB ID 1). Dois gNBs com o
  # mesmo ID na AMF se derrubariam no NG Setup.
  gnb.yaml: |
    mcc: '208'
    mnc: '93'

    nci: '0x000000020'
    idLength: 32
    tac: 1              # casa com supportTaiList[0].tac: 000001 do amf.yaml

    linkIp: 127.0.0.1
    ngapIp: '@POD_IP@'
    gtpIp: '@POD_IP@'

    amfConfigs:
      - address: amf.free5gc.svc.cluster.local
        port: 38412
    slices:
      - sst: 0x1
        sd: 0x112233    # a fatia do ruido (ver o cabecalho)

    ignoreStreamIds: true

  ue.yaml: |
    # UE de ruido. Casa com IMSI_RUIDO em scripts/ruido-gtp.py, que o cadastra
    # na fatia 112233 com AMBR alto.
    supi: 'imsi-208930000090000'
    mcc: '208'
    mnc: '93'
    protectionScheme: 0
    homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
    homeNetworkPublicKeyId: 1
    routingIndicator: '0000'

    key: '8baf473f2f8fd09487cccbd7097c6862'
    op: '8e27b6af0e692e750f32667a3b14605d'
    opType: 'OPC'
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'

    tunNetmask: '255.255.255.0'

    # false: o container 'iperf' precisa enxergar a uesimtun0 (mesmo netns).
    useNamespace: false

    gnbSearchList:
      - 127.0.0.1

    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false

    sessions:
      - type: 'IPv4'
        apn: 'internet'
        slice:
          sst: 0x01
          sd: 0x112233

    configured-nssai:
      - sst: 0x01
        sd: 0x112233
    default-nssai:
      - sst: 1
        sd: 1

    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruido-ueransim
  namespace: free5gc
  labels:
    app: ruido-ueransim
spec:
  replicas: 1
  # Recreate: dois pods com o mesmo gNB ID e o mesmo IMSI no ar ao mesmo tempo
  # brigariam na AMF durante o rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ruido-ueransim
  template:
    metadata:
      # Sem 'epc-mode': os testes acham o tester e as NFs por esse label, e
      # este pod nao pode ser confundido com o tester do experimento.
      labels:
        app: ruido-ueransim
    spec:
      # SEGUNDA CELULA, num brix de fora do experimento (escolha do orientador).
      # Mesmo segmento dos brix (<edge-subnet>), atras do mesmo switch: o
      # GTP-U do fundo desce o mesmo enlace nuvem -> borda que o trafego medido.
      # Nao pode ser o brix-porvir-01 (Edge Node) nem o brix-porvir-02 (tester):
      # o fundo pioraria o b-mec por CPU, nao por congestao.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: brix-porvir-03
        #nodetype: server
      # O 'sleep infinity' do container iperf e' PID 1 e ignora o SIGTERM: sem
      # isto cada recriacao do pod (os scripts recriam a cada deploy do
      # cenario) esperaria os 30 s padrao a toa.
      terminationGracePeriodSeconds: 3
      volumes:
        - name: ruido-config
          configMap:
            name: ruido-ueransim-config
        - name: ruido-run
          emptyDir: {}
      containers:
        - name: gnb
          image: free5gc/ueransim:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              sed "s/@POD_IP@/${POD_IP}/g" /config/gnb.yaml > /run/ueransim/gnb.yaml
              echo "[gnb] ngapIp/gtpIp = ${POD_IP}"
              exec ./nr-gnb -c /run/ueransim/gnb.yaml
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # Rede de seguranca do descarte da chain RUIDO-GTPU: se ele faltar, a
          # fila sem limite do nr-gnb mata ESTE container, nao o brix.
          resources:
            limits:
              memory: 512Mi
          volumeMounts:
            - name: ruido-config
              mountPath: /config
            - name: ruido-run
              mountPath: /run/ueransim
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
        - name: ue
          image: free5gc/ueransim:v4.2.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /config/ue.yaml /run/ueransim/ue.yaml
              until [ -f /run/ueransim/gnb.yaml ]; do sleep 1; done
              sleep 5
              exec ./nr-ue -c /run/ueransim/ue.yaml
          resources:
            limits:
              memory: 512Mi
          volumeMounts:
            - name: ruido-config
              mountPath: /config
            - name: ruido-run
              mountPath: /run/ueransim
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN"]
        # ---------------------------------------------------------------
        # iperf3 + descarte do excedente. Mesmo netns do gNB e do UE: enxerga
        # a uesimtun0 (o cliente do fundo usa -B no IP do UE) e o INPUT por
        # onde o GTP-U chega ao nr-gnb.
        #
        # Tambem serve o iperf3 TCP da capacidade na eth0 do pod (porta 5201),
        # FORA do tunel: petshopboys -> brix-03 pelo mesmo fio do GTP-U.
        # ---------------------------------------------------------------
        - name: iperf
          image: nicolaka/netshoot:v0.13
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Idempotente: o netns e' do POD e sobrevive ao restart do container.
              iptables -N RUIDO-GTPU 2>/dev/null || iptables -F RUIDO-GTPU
              # 1) pequenos passam sempre: TCP do controle do iperf, NGAP nao
              #    (e' SCTP), ACKs. So' o UDP grande do fundo e' descartado.
              iptables -A RUIDO-GTPU -m length --length 0:400 -j RETURN
              # 2) um fio do fundo chega ao UE (~2000 pps, ~22 Mbps): prova de
              #    que a sessao entrega, dentro do que o UERANSIM aguenta.
              iptables -A RUIDO-GTPU -m limit --limit 2000/sec --limit-burst 2000 -j RETURN
              # 3) o resto ja' cruzou o enlace: descarta antes do nr-gnb.
              iptables -A RUIDO-GTPU -j DROP
              iptables -C INPUT -p udp --dport 2152 -j RUIDO-GTPU 2>/dev/null \
                || iptables -I INPUT 1 -p udp --dport 2152 -j RUIDO-GTPU
              iptables -nvx -L RUIDO-GTPU
              iperf3 -s -p 5201 -D
              exec sleep infinity
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          ports:
            - name: tcp-5201
              protocol: TCP
              containerPort: 5201
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruido-gerador
  namespace: free5gc
  labels:
    app: ruido-gerador
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruido-gerador
  template:
    metadata:
      labels:
        app: ruido-gerador
    spec:
      # FONTE do fundo, no MESMO NO da UPF de ancoragem (upf no A, psa-upf no
      # B). O N6 entre este pod e a UPF nao sai do no; o unico trecho que cruza
      # a rede e' o GTP-U da UPF ate' o brix-03. Se a UPF de ancoragem mudar de
      # no, mude aqui junto -- os scripts conferem.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: petshopboys
        #nodetype: server
      terminationGracePeriodSeconds: 3
      containers:
        - name: iperf
          image: nicolaka/netshoot:v0.13
          imagePullPolicy: IfNotPresent
          # 5201: servidor do fundo (o UE de ruido conecta com -R e este lado
          # envia). Em laco para os scripts poderem mata-lo ao desligar o fundo
          # -- garantia de que nada continua enviando -- sem derrubar o pod.
          # 5202 no LOOPBACK: controle de CPU do piloto (o gerador trabalha
          # igual e nada sai para a rede), como no congestao/iperf.yaml.
          command: ["/bin/sh", "-c"]
          args:
            - |
              iperf3 -s -p 5202 -B 127.0.0.1 -D
              while true; do iperf3 -s -p 5201; sleep 1; done
          ports:
            - name: tcp-5201
              protocol: TCP
              containerPort: 5201
            - name: udp-5201
              protocol: UDP
              containerPort: 5201
